<!-- ============================================================
     VORLAGE — kopiere diese Datei, benenne sie um (z.B. max.html)
     und trage den Pfad in index.html unter SLIDES ein.

     Du kannst hier mehrere <section>-Blöcke haben (= mehrere Folien).
     Die Seitenzahlen werden automatisch gesetzt — nicht anfassen.
     ============================================================ -->

<section class="slide section-cover">
  <div class="brand-bar" style="background: var(--itemis-cyan);"></div>

  <div class="frame frame--center">
    <div class="title-block" style="gap:32px;">
      <div style="display:flex; align-items:center; gap:24px;">
        <img src="assets/logo-horizontal-white.svg" alt="itemis" style="height:56px;" />
        <span style="font-family:var(--font-display); font-weight:300; font-size:36px; color:rgba(255,255,255,.5); letter-spacing:0.02em;">| Dein Projekt</span>
      </div>
      <div class="eyebrow" style="font-size:22px; color:var(--itemis-cyan);">Mai 2026 · Interne Vorstellung</div>
      <h1 style="font-size:120px; line-height:0.95; letter-spacing:-0.03em;">
        Dein Titel<br>
        <span style="color:var(--itemis-cyan);">Hier</span>
      </h1>
      <p class="lede" style="color:rgba(255,255,255,.7); font-size:36px; max-width:1100px; margin-top:24px;">
        Kurze Beschreibung des Projekts.
      </p>
    </div>
  </div>

  <div class="slide-footer">
    <div class="meta"><span style="color:rgba(255,255,255,.7);">Dein Name</span></div>
    <div class="pageno" style="color:rgba(255,255,255,.4);"></div>
  </div>
</section>


<section class="slide" data-screen-label="Inhalt">
  <img class="slide-logo" src="assets/logo-horizontal-white.svg" alt="itemis" />

  <div class="frame">
    <div class="title-block" style="margin-bottom:56px;">
      <div class="eyebrow">Thema</div>
      <h1>Deine zweite Folie.</h1>
    </div>

    <div class="grid-2" style="gap:64px; align-items:flex-start;">
      <div class="col" style="gap:24px;">
        <h3>Linke Spalte</h3>
        <ul class="bullets">
          <li>Punkt eins</li>
          <li>Punkt zwei</li>
          <li>Punkt drei</li>
        </ul>
      </div>
      <div class="col" style="gap:24px;">
        <h3>Rechte Spalte</h3>
        <p style="font-size:24px;">Ergänzender Text oder Bild hier.</p>
      </div>
    </div>
  </div>

  <div class="slide-footer">
    <div class="meta"><span class="speaker">Dein Name</span></div>
    <div class="pageno"></div>
  </div>
</section>
